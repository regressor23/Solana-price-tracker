<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>SOL Warzone — live SOL/USDC order flow</title>
    <meta
      name="description"
      content="Live SOL/USDC order flow from Jupiter, rendered as a battle between Orcs and the Nexus."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      The scene is the page, and the HUD lies over it. Two siblings rather than
      a wrapper: the canvas must not be inside anything that scrolls, resizes or
      paints, because every one of those costs it a resize of the drawing buffer.
    -->
    <div class="scene" id="stage"></div>

    <div class="hud" id="hud">
      <header class="topbar" id="topbar">
        <span class="clock num" id="clock">--:--:--</span>

        <div class="pair">
          <span class="pair__label" id="pairLabel">SOL/USDC · JUPITER</span>
          <span class="pair__price num" id="price" data-skeleton="price"></span>
          <span class="pair__tick num" id="tick"></span>
        </div>

        <div class="feed-state">
          <span class="feed-state__label">FEED</span>
          <span class="feed-state__value" id="status" data-status="offline"
            >offline</span
          >
        </div>
      </header>

      <div class="walls" id="walls"></div>

      <!-- Untouchable by anything but the round banner. See layout.css. -->
      <div class="arena" id="arena"></div>

      <section class="dock" id="dock">
        <section class="panel" id="curvePanel">
          <h2 class="panel__title">Liquidity curve</h2>
        </section>
        <section class="panel" id="feedPanel">
          <h2 class="panel__title">Battle feed</h2>
          <p class="panel__note num" id="log">waiting for collector…</p>
        </section>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
